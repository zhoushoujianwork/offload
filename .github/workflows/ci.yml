name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: swift test --package-path macos
      - name: Render monitor panel states
        env:
          OFFLOAD_PANEL_RENDER_DIR: ${{ github.workspace }}/panel-renders
        run: swift test --package-path macos --filter PanelRenderTests
      - name: Upload panel renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-panel-renders
          path: panel-renders/*.png
          if-no-files-found: error
      - name: Build app
        run: scripts/build-macos-app.sh
